{{ $isAdoc := false }}
{{ if .File }}
    {{ $isAdoc = or (eq .File.Ext ".adoc") (eq .File.Ext ".asciidoc") }}
{{ end }}

{{ if $isAdoc }}
    <div class="js-toc-mobile-container"></div>
{{ else }}
    {{ $toc := .TableOfContents }}
    {{ replaceRE "<ul>" "<ul class=\"dropdown-menu\">" (replaceRE "<nav id=\"TableOfContents\">" "<nav id=\"toc-mobile\">" $toc) 1 | safeHTML }}
{{ end }}
