<toc>
    <div class="fw-bold text-uppercase mb-2">On this page</div>
    {{ if $.Scratch.Get "needsAsciiDocTOC" -}}
        <nav id="toc" data-asciidoc-toc="desktop"></nav>
    {{ else if eq .Site.Params.docs.scrollSpy true -}}
        {{ .TableOfContents | replaceRE "<nav id=\"TableOfContents\">" "<nav id=\"toc\">" | safeHTML }}
    {{ else -}}
        {{ .TableOfContents }}
    {{ end -}}
</toc>
